<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      display: none
    }

    .attribution a {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="img-cont">
      <img class="small" alt="perfume" src="./images/image-product-mobile.jpg" />
      <img class="large" alt="perfume" src="./images/image-product-desktop.jpg" />
    </div>
    <div class="text-cont">
      <p class="category">PERFUME</p>
      <h1>Gabrielle Essence Eau De Parfum</h1>
      <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>
    
      <div class="price-cont">
        <p>$149.99</p>
        <p>$169.99</p>
      </div>
      <button type="button">
        <img class="icon" alt="cart" src="./images/icon-cart.svg" />
        Add to Cart
      </button>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
